name: scene-saas

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: scene_user
      POSTGRES_PASSWORD: scene_password
      POSTGRES_DB: scene_db
    volumes:
      - scene_postgres_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    restart: unless-stopped

  backend:
    image: scene-saas-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://scene_user:scene_password@db:5432/scene_db
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - ./uploads:/app/uploads
    command: sh -c "sleep 5 && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./core:/app
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "5175:5173"
    command: sh -c "if [ ! -d node_modules ]; then npm install; fi && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  scene_postgres_data:
