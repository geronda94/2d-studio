name: scene-saas

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: scene_user
      POSTGRES_PASSWORD: scene_password
      POSTGRES_DB: scene_db
    volumes:
      - scene_postgres_data:/var/lib/postgresql/data
    ports:
      - "5437:5432"
    restart: unless-stopped

  backend:
    # Bootstrap uses a prebuilt image; rebuild with:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build backend
    image: scene-saas-backend:latest
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://scene_user:scene_password@db:5432/scene_db
      - STT_URL=${STT_URL:-http://host.docker.internal:8788}
      - STT_KEY=${STT_KEY:-local-whisper-key}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - ./uploads:/app/uploads
    command: sh -c "sleep 5 && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./core:/app
      - scene_node_modules:/app/node_modules
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "5175:5173"
    command: sh -c "if [ ! -f node_modules/.package-lock.json ]; then npm ci --no-audit --no-fund; fi && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  scene_postgres_data:
  scene_node_modules:
