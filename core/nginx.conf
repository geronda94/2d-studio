server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Rendered videos + загруженное медиа раздаёт backend (StaticFiles /uploads, /media).
    # Нужно для предпросмотра/скачивания видео прямо в браузере (Range-запросы плеера).
    # Public model/rig assets are fetched by sandboxed scene iframes (origin null).
    location /models/ {
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }
    location /vendor/ {
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }
    location /rive/ {
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # Handle SPA routing (Vue Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
