<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Rive character</title>
<style>
  body{margin:0;background:#0b1018;color:#e8eef7;font:13px system-ui;padding:12px}
  #bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  #bar button{background:#1d4ed8;color:#fff;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
  #bar button.ghost{background:#1b2740}
  #bar input[type=range]{flex:1;min-width:220px}
  #stage{position:relative;width:min(92vw, calc(92vh * 6 / 10));aspect-ratio:6/10;margin:0 auto;border-radius:8px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#1b2435,#0b1018 70%)}
  #c{width:100%;height:100%;display:block}
  #v{font:12px monospace;color:#7fb2ff}
  select{background:#16203a;color:#e8eef7;border:1px solid #2a3b5c;border-radius:6px;padding:4px}
</style></head><body>
<div id="bar">
  <button onclick="step(-100)">-0.1</button><button onclick="step(100)">+0.1</button>
  <input id="time" type="range" min="0" max="7000" value="0" step="10">
  <span id="v">t=0</span>
  <select id="who"></select>
  <label><input id="walk" type="checkbox">walk</label>
  <button id="wave" class="ghost">wave</button>
  <button id="play" class="ghost">play</button>
</div>
<div id="stage"><canvas id="c" width="720" height="1200"></canvas></div>
<script src="/vendor/rive.js"></script>
<script src="/vendor/rive-character.js"></script>
<script>
const who=document.getElementById('who');
for(const [k,v] of Object.entries(RiveCharacter.presets)){ const o=document.createElement('option'); o.value=k;o.textContent=v.label;who.appendChild(o) }
const slider=document.getElementById('time'), vEl=document.getElementById('v');
let rig=null, raf=null;
const GESTURES=[{at:4200,type:'wave',hand:'R',dur:1600}];
async function boot(){
  if(rig){ rig = null; }
  rig = RiveCharacter.create(document.getElementById('c'), {
    character: who.value,
    src:'/rive/character.riv',
    visemes:[
      {t:0,viseme:0},{t:700,viseme:2},{t:900,viseme:1},{t:1150,viseme:4},{t:1450,viseme:1},
      {t:1650,viseme:8},{t:1950,viseme:4},{t:2300,viseme:1},{t:2600,viseme:6},{t:2900,viseme:1},
      {t:3200,viseme:7},{t:3500,viseme:2},{t:3800,viseme:4},{t:4200,viseme:1},{t:4600,viseme:8},
    ],
    gestures:GESTURES, walk:document.getElementById('walk').checked,
    onReady(){ seek(Number(slider.value)); window.__ready=true },
    onError(e){ document.getElementById('v').textContent='ERR '+e }
  });
  window.__rig=rig;
}
function seek(t){ slider.value=t; vEl.textContent='t='+Math.round(t); if(rig) rig.seek(t); }
slider.oninput=()=>seek(Number(slider.value));
who.onchange=()=>boot();
document.getElementById('walk').onchange=()=>boot();
document.getElementById('wave').onclick=()=>{ seek(4200); };
document.getElementById('play').onclick=()=>{
  if(raf){cancelAnimationFrame(raf);raf=null;return}
  let t=Number(slider.value),last=performance.now();
  const loop=(now)=>{ t=(t+(now-last))%7000; last=now; seek(t); raf=requestAnimationFrame(loop) };
  raf=requestAnimationFrame(loop);
};
function step(d){ seek(Math.max(0,Math.min(7000,Number(slider.value)+d))) }
boot();
</script></body></html>
