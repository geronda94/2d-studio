<!DOCTYPE html><html><head><meta charset="utf-8"><title>Rive VM test</title>
<style>body{margin:0;background:#111;color:#eee;font:12px system-ui;padding:10px}canvas{background:#101820;border:1px solid #333}</style></head>
<body>
<div id="log">loading</div>
<canvas id="c" width="400" height="400"></canvas>
<script src="/vendor/rive.js"></script>
<script>
const log=document.getElementById('log');
window.__ready=false; window.__err=null;
const r=new rive.Rive({src:'/rive/rigtest.riv',canvas:document.getElementById('c'),autoplay:false,autoBind:true,stateMachine:'State Machine 1',
  onLoad(){ try{ r.play('State Machine 1'); }catch(e){}
    const vm=r.viewModelInstance; window.__r=r;
    window.__vm=vm;
    window.__set=(a,f)=>{ try{ vm.number('bodyAngle').value=a; vm.number('foreAngle').value=f; r.drawFrame(); log.textContent='set '+a+' '+f; }catch(e){ window.__err=String(e); log.textContent='ERR '+e; } };
    window.__set(1.5707964,0); window.__ready=true; log.textContent='ready vm='+!!vm;
  }, onLoadError(e){window.__err=String(e);log.textContent='loaderr '+e}
});
</script></body></html>
