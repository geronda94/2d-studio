<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Babylon avatar test</title>
<style>
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 30%,#1b2435,#080b11 70%);overflow:hidden}
#c{width:100%;height:100%;display:block;outline:none}
#log{position:fixed;left:10px;top:10px;max-width:46vw;max-height:80vh;overflow:auto;background:rgba(8,12,20,.82);color:#9fe3b0;font:11px/1.4 monospace;padding:10px;border-radius:8px;white-space:pre-wrap}
</style></head><body>
<canvas id="c"></canvas><pre id="log">loading…</pre>
<script src="/vendor/babylon.js"></script>
<script src="/vendor/babylonjs.loaders.min.js"></script>
<script>
const log=(...a)=>{document.getElementById('log').textContent += '\n'+a.join(' ');};
const canvas=document.getElementById('c');
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true,alpha:true});
const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(0,0,0,0);
scene.ambientColor=new BABYLON.Color3(0.3,0.3,0.35);
const camera=new BABYLON.ArcRotateCamera('cam',-Math.PI/2,Math.PI/2.35,3.0,new BABYLON.Vector3(0,1.05,0),scene);
camera.lowerRadiusLimit=1.2;camera.upperRadiusLimit=8;
const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene);
hemi.intensity=0.9;hemi.groundColor=new BABYLON.Color3(0.18,0.2,0.26);
const dir=new BABYLON.DirectionalLight('dir',new BABYLON.Vector3(-0.5,-1,0.7),scene);
dir.position=new BABYLON.Vector3(3,6,-4);dir.intensity=1.5;
const ground=BABYLON.MeshBuilder.CreateGround('ground',{width:10,height:10},scene);
const gm=new BABYLON.StandardMaterial('gm',scene);gm.diffuseColor=new BABYLON.Color3(0.10,0.12,0.17);gm.specularColor=new BABYLON.Color3(0,0,0);ground.material=gm;ground.position.y=-0.001;
const shadow=new BABYLON.ShadowGenerator(1024,dir);shadow.useBlurExponentialShadowMap=true;shadow.blurKernel=32;ground.receiveShadows=true;
let root=null,skeleton=null,bones={},morphs=[],rest={};
window.__info={};
BABYLON.SceneLoader.ImportMeshAsync('', '/models/', 'brunette.glb', scene).then((res)=>{
  root=res.meshes[0];
  skeleton=res.skeletons[0];
  log('root',root.name,'meshes',res.meshes.length,'skeleton',skeleton&&skeleton.bones.length);
  for(const b of (skeleton?skeleton.bones:[])){bones[b.name]=b; rest[b.name]=b.rotationQuaternion?b.rotationQuaternion.clone():null;}
  for(const m of res.meshes){
    if(m.morphTargetManager){ morphs.push(m); }
    if(m.material){ m.material.backFaceCulling=true; }
    if(m.name!=='ground'){ try{shadow.addShadowCaster(m)}catch(e){} }
  }
  const names=Object.keys(bones);
  const mtNames=morphs.length?morphs[0].morphTargetManager.numTargets:0;
  let targets=[]; if(morphs.length){ const mm=morphs[0].morphTargetManager; for(let i=0;i<mm.numTargets;i++) targets.push(mm.getTarget(i).name); }
  window.__info={bones:names,morphs:morphs.map(m=>m.name),targets};
  log('bones',names.slice(0,20).join(', '));
  log('morph meshes',morphs.map(m=>m.name).join(', '));
  log('targets',targets.slice(0,20).join(', '), 'total', targets.length);
  window.__ready=true;
  scene.render();
}).catch(e=>{log('ERROR',String(e));window.__error=String(e)});
window.addEventListener('resize',()=>engine.resize());
</script></body></html>
