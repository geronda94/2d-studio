<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Rive: подбор персонажей</title>
<style>
  body{margin:0;padding:14px;background:#0A0E16;color:#DCE6F5;font:12px/1.45 system-ui}
  h1{font-size:16px;margin:0 0 4px}
  .hint{color:#8CA2C0;margin-bottom:12px}
  table{border-collapse:collapse;width:100%;max-width:1500px}
  th,td{border-bottom:1px solid #1C2740;padding:6px 8px;text-align:left;vertical-align:top;font-size:11px}
  th{color:#9FC0F0;font-weight:600;position:sticky;top:0;background:#0A0E16}
  canvas{border-radius:4px;background:#121B2B;display:block}
  .ok{color:#4ADE80}.bad{color:#F87171}.warn{color:#FBBF24}.dim{color:#7F93AF}
  .lic{font-family:ui-monospace,monospace}
  .row{display:flex;gap:6px;align-items:center}
</style>
</head>
<body>
<h1>Подбор Rive-персонажей</h1>
<div class="hint">Для каждого файла: лицензия, клипы, наличие view model и <b>живой тест липсинка</b> (ставим визем aa и oh, ждём 0.6 с, сравниваем кадры).</div>
<table><thead><tr>
<th>персонаж</th><th>лицензия</th><th>размер</th><th>клипы</th><th>стейт-машины</th><th>view model</th><th>тест липсинка</th><th>кадр</th>
</tr></thead><tbody id="tb"></tbody></table>
<script src="/vendor/rive.js"></script>
<script>
const ASSETS = [
  { name:'tiny-mascot',   src:'/rive/tiny.riv',    lic:'GPL-3.0',  note:'OpenHuman', size:'185 KB' },
  { name:'toshi',         src:'/rive/toshi.riv',   lic:'GPL-3.0',  note:'OpenHuman', size:'2.2 MB' },
  { name:'jarvis',        src:'/rive/jarvis.riv',  lic:'GPL-3.0',  note:'OpenHuman', size:'62 KB' },
  { name:'kabi',          src:'/rive/kabi.riv',    lic:'CC-BY-4.0', note:'bryllim', size:'252 KB' },
  { name:'uko',           src:'/rive/uko.riv',     lic:'MIT',      note:'hoshuko', size:'74 KB' },
  { name:'aituko',        src:'/rive/aituko.riv',  lic:'MIT',      note:'hoshuko', size:'72 KB' },
  { name:'meowuko',       src:'/rive/meowuko.riv', lic:'MIT',      note:'hoshuko', size:'73 KB' },
  { name:'rive-avatar',   src:'/rive/rive-avatar.riv', lic:'Rive blog (free)', note:'официальный аватар', size:'786 KB' },
  { name:'cva-mascot',    src:'/rive/cva-mascot.riv',  lic:'MIT',  note:'robofighter ★96 lipsync-demo', size:'785 KB' },
  { name:'benny',         src:'/rive/benny.riv',       lic:'MIT',  note:'avatar-library', size:'28 KB' },
  { name:'boy',           src:'/rive/boy.riv',         lic:'нет лицензии', note:'Rive-LipSync-Previewer', size:'21 KB' },
  { name:'girl',          src:'/rive/girl.riv',        lic:'нет лицензии', note:'Rive-LipSync-Previewer', size:'22 KB' },
];
const tb = document.getElementById('tb');
const wait = ms => new Promise(r => setTimeout(r, ms));

function row(name, lic, note) {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td><b>${name}</b><div class="dim">${note||''}</div></td>
    <td class="lic">${lic}</td><td class="dim">…</td><td></td><td></td><td></td><td></td>
    <td><canvas width="110" height="110"></canvas></td>`;
  tb.appendChild(tr);
  return tr;
}

function pix(cv) {
  try { return cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data } catch(e) { return null }
}
function diff(a,b){ if(!a||!b) return -1; let n=0,t=0; for(let i=3;i<a.length;i+=4){t++; if(Math.abs(a[i]-b[i])>8)n++} return t?n/t*100:0 }

async function probe(a) {
  const tr = row(a.name, a.lic, a.note);
  const cv = tr.querySelector('canvas');
  cv.style.width = '110px'; cv.style.height = '110px';
  const inst = await new Promise(res => {
    let r=null;
    r = new rive.Rive({ src:a.src, canvas:cv, autoplay:false, autoBind:true,
      layout: new rive.Layout({ fit: rive.Fit.Contain, alignment: rive.Alignment.Center }),
      onLoad: () => { try { r.resizeDrawingSurfaceToCanvas() } catch(e){} res(r) },
      onLoadError: () => res(null) });
    setTimeout(() => res(r), 20000);
  });
  const tds = tr.querySelectorAll('td');
  tds[2].textContent = a.size || '—';
  if (!inst) { tds[6].innerHTML = '<span class="bad">не загрузился</span>'; return }
  const anims = inst.animationNames || [];
  const sms = inst.stateMachineNames || [];
  const vis = anims.filter(x => /viseme|mouth/i.test(x));
  const blink = anims.filter(x => /blink|eye/i.test(x));
  tds[2].textContent = a.size || '—';
  tds[3].innerHTML = `${anims.length} всего` + (vis.length ? `<br><span class="ok">рот: ${vis.length}</span>` : '<br><span class="bad">рот: 0</span>') + (blink.length ? `<br><span class="dim">глаза: ${blink.length}</span>` : '');
  tds[4].textContent = sms.join(', ') || '—';
  // view model
  let vm = null, vprop = null, pprop = null;
  try { vm = inst.viewModelInstance } catch(e){}
  if (vm) { try { vprop = vm.enum('mouthVisemeCode') } catch(e){} ; try { pprop = vm.enum('pose') } catch(e){} }
  tds[5].innerHTML = vm
    ? (vprop ? `<span class="ok">mouthVisemeCode ✓</span>` : `<span class="warn">есть, но mouthVisemeCode ✗</span>`) + (pprop ? ' <span class="dim">+pose</span>' : '')
    : '<span class="bad">нет</span>';
  if (sms[0]) { try { inst.play(sms[0]) } catch(e){} }

  // живой тест липсинка
  if (vprop) {
    const run = async (codes) => {
      const snaps = [];
      for (const c of codes) { try { vprop.value = c } catch(e){} ; await wait(620); snaps.push(pix(cv)) }
      let best = 0;
      for (let i=1;i<snaps.length;i++) best = Math.max(best, diff(snaps[0], snaps[i]));
      return best;
    };
    let best = await run(['aa','oh','ou','PP','sil']);
    let variant = 'нижний';
    if (best < 0.15) { best = await run(['AA','OH','OU','PP','sil']); variant = 'ВЕРХНИЙ' }
    tds[6].innerHTML = best > 0.15
      ? `<span class="ok">работает (${best.toFixed(1)}%, ${variant})</span>`
      : `<span class="warn">слабо/нет (${best.toFixed(2)}%)</span>`;
  } else {
    const clips = anims.filter(x => /mouthShape|mouth_|viseme/i.test(x));
    if (clips.length >= 2) {
      const capture = async (n) => { try { inst.play(n) } catch(e){} ; await wait(500); try { inst.drawFrame() } catch(e){} ; return pix(cv) };
      const a1 = await capture(clips[0]);
      const a2 = await capture(clips[1]);
      const d = diff(a1, a2);
      tds[6].innerHTML = d > 0.15
        ? `<span class="ok">клипы рта работают (${d.toFixed(1)}%)</span><br><span class="dim">${clips.slice(0,6).join(', ')}</span>`
        : `<span class="warn">клипы есть, переключение не видно (${d.toFixed(2)}%)</span><br><span class="dim">${clips.slice(0,6).join(', ')}</span>`;
    } else {
      tds[6].innerHTML = '<span class="bad">нет контракта виземов</span>';
    }
  }
  try { inst.drawFrame() } catch(e){}
}

(async () => {
  for (const a of ASSETS) { try { await probe(a) } catch(e) { console.error(a.name, e) } }
  window.__done = true;
})();
</script>
</body>
</html>
