<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Rig test — character-talk</title>
<style>
  :root { --bg-base:#0A0F1C; --bg-surface:#141C2E; --text-primary:#EDF2F7; --text-secondary:#9FB0C8;
          --brand-blue:#3E7BFA; --brand-light-blue:#7FB2FF; --brand-green:#2FBF87;
          --font-sans:'Segoe UI',system-ui,sans-serif; --font-heading:Georgia,serif; --font-mono:monospace; }
  body { margin:0; background:#05070C; color:#EDF2F7; font-family:system-ui; }
  #bar { display:flex; gap:10px; align-items:center; padding:8px 14px; background:#10151F; flex-wrap:wrap; }
  #bar label { font-size:12px; opacity:.7; }
  #time { flex:1; min-width:200px; }
  #stage { position:relative; width:min(92vw, calc(92vh * 16 / 9)); aspect-ratio:16/9; margin:12px auto; overflow:hidden; border-radius:8px; }
  #v { position:absolute; left:50%; transform:translateX(-50%); font:700 12px monospace; color:#7FB2FF; text-align:center; }
</style>
</head>
<body>
<div id="bar">
  <button onclick="step(-100)">-0.1</button>
  <button onclick="step(100)">+0.1</button>
  <input id="time" type="range" min="0" max="7000" value="900" step="10">
  <span id="v">t=900 v=0</span>
  <label>mood <select id="mood"><option>neutral</option><option selected>joy</option><option>anger</option><option>sad</option><option>surprise</option></select></label>
  <label><input id="walk" type="checkbox">walk</label>
  <button id="play">play</button>
</div>
<div id="stage"></div>
<script src="/vendor/scene-kit.js"></script>
<script src="/vendor/gsap.min.js"></script>
<script src="/vendor/character-canvas.js"></script>
<script>
const API = 'http://localhost:8002';
const stage = document.getElementById('stage');
const slider = document.getElementById('time');
const vEl = document.getElementById('v');
let scene = null, props = null, raf = null;

function seek(t) {
  if (scene && scene.seek) scene.seek(t);
  const vis = (props.visemes || []);
  const v = SceneKit.visemeAt(vis, t);
  vEl.textContent = `t=${Math.round(t)} v=${v}`;
}

async function boot() {
  const q0 = new URLSearchParams(location.search);
  const pres = q0.get('pres');
  const objSlug = q0.get('obj');
  let tpl, isObj = false;
  if (pres) {
    const scenes = await (await fetch(API + '/presentations/' + pres + '/scenes')).json();
    const sid = q0.get('slide');
    tpl = sid ? scenes.find(s => s.slide_id === sid) : scenes[0];
    tpl = { code: tpl.code, default_props: tpl.props || {}, props_schema: tpl.props_schema || {}, cues: [] };
  } else if (objSlug) {
    const o = await (await fetch(API + '/scene-library/objects/' + objSlug)).json();
    tpl = { code: { html: o.html, css: o.css, js: '' }, default_props: {}, props_schema: {}, cues: [] };
    isObj = true;
  } else {
    const slug = q0.get('tpl') || 'character-talk';
    tpl = await (await fetch(API + '/scene-library/templates/' + slug)).json();
  }
  const style = document.createElement('style');
  style.textContent = tpl.code.css;
  document.head.appendChild(style);
  stage.innerHTML = tpl.code.html;
  props = { ...tpl.default_props, mood: document.getElementById('mood').value, walk: document.getElementById('walk').checked };
  window.__sceneProps = props;
  window.__sceneCues = tpl.cues;
  const fn = new Function(tpl.code.js);
  if (isObj) {
    // крупный план: персонаж во весь кадр
    stage.style.background = 'radial-gradient(ellipse at 50% 30%, #2A3547 0%, #131A26 60%, #0A0E16 100%)';
    const el = stage.querySelector('.obj-character');
    if (el) {
      el.style.left = '50%'; el.style.bottom = '0'; el.style.marginLeft = '-25%';
      el.style.width = '50%'; el.style.height = '100%';
    }
    const rig = SceneKit.characterRig(el, { visemes: props.visemes || [], mood: props.mood });
    scene = { seek(t) { rig.seek(t); } };
  } else {
    fn();
    scene = window.scene;
  }
  const q = new URLSearchParams(location.search);
  const ar = q.get('ar');
  if (ar) {
    const [w, h] = ar.split(/[x:]/).map(Number);
    stage.style.aspectRatio = w + '/' + h;
    stage.style.width = 'min(92vw, calc(92vh * ' + w + ' / ' + h + '))';
  }
  if (q.get('face')) {
    const svg = stage.querySelector('.character-svg');
    if (svg) { svg.style.transform = 'scale(2.6)'; svg.style.transformOrigin = '50% 22%'; }
  }
  const t0 = Number(q.get('t'));
  slider.value = Number.isFinite(t0) && t0 > 0 ? t0 : slider.value;
  seek(Number(slider.value));
}

slider.oninput = () => seek(Number(slider.value));
document.getElementById('mood').onchange = async () => { window.scene = null; await boot(); };
document.getElementById('walk').onchange = async () => { window.scene = null; await boot(); };
function step(d) { slider.value = Math.max(0, Math.min(7000, Number(slider.value) + d)); seek(Number(slider.value)); }
document.getElementById('play').onclick = () => {
  if (raf) { cancelAnimationFrame(raf); raf = null; return; }
  let t = Number(slider.value), last = performance.now();
  const loop = (now) => { t = (t + (now - last)) % 7000; last = now; slider.value = t; seek(t); raf = requestAnimationFrame(loop); };
  raf = requestAnimationFrame(loop);
};
boot();
</script>
</body>
</html>
