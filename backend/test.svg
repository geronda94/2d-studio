 <svg width="100%" height="100%" viewBox="0 0 1440 500" preserveAspectRatio="xMidYMax slice"><rect width="100%" height="100%" fill="#FFF8EB" /> <defs> <g id="tree1" stroke="currentColor" stroke-width="6" stroke-linejoin="round"> <polygon points="0,0 -15,50 15,50" /> <polygon points="0,25 -20,90 20,90" /> <polygon points="0,50 -25,140 25,140" /> </g> <g id="tree2" stroke="currentColor" stroke-width="8" stroke-linejoin="round"> <polygon points="0,0 -20,70 20,70" /> <polygon points="0,30 -25,110 25,110" /> <polygon points="0,60 -30,170 30,170" /> </g> <g id="teepee"> <path d="M0,0 Q-25,40 -45,100 L45,100 Q25,40 0,0 Z" fill="#8B7355" /> <path d="M0,0 Q-25,40 -45,100 L0,100 Z" fill="#6E5A42" /> <path d="M-8,15 L-25,60 M-15,35 L-35,85 M8,15 L25,60 M15,35 L35,85 M0,20 L0,80" stroke="#524330" stroke-width="2.5" stroke-linecap="round" opacity="0.35" /> <line x1="0" y1="5" x2="-15" y2="-20" stroke="#2C211A" stroke-width="4" stroke-linecap="round" /> <line x1="0" y1="5" x2="10" y2="-15" stroke="#2C211A" stroke-width="3.5" stroke-linecap="round" /> <line x1="0" y1="5" x2="2" y2="-25" stroke="#2C211A" stroke-width="3" stroke-linecap="round" /> <path d="M0,35 L-15,100 L15,100 Z" fill="#2A2318" /> </g> <g id="campfire"> <path d="M-15,10 L15,25 M-15,25 L15,10" stroke="#2C211A" stroke-width="4" stroke-linecap="round"/> <path fill="#D87B22" d="M 0,-10 Q 8,5 12,15 Q 15,25 0,25 Q -15,25 -12,15 Q -8,5 0,-10 Z" /> <path fill="#FFC107" d="M 0,2 Q 6,8 8,16 Q 9,23 0,23 Q -9,23 -8,16 Q -6,8 0,2 Z" /> </g> <g id="flower1"> <circle cx="0" cy="0" r="1.5" fill="#D87B22" opacity="0.8"/> </g> <g id="flower2"> <circle cx="0" cy="0" r="1.2" fill="#FFC107" opacity="0.9"/> <circle cx="-1.5" cy="-1.5" r="1" fill="#fff" opacity="0.8"/> <circle cx="1.5" cy="-1.5" r="1" fill="#fff" opacity="0.8"/> <circle cx="-1.5" cy="1.5" r="1" fill="#fff" opacity="0.8"/> <circle cx="1.5" cy="1.5" r="1" fill="#fff" opacity="0.8"/> </g> <g id="logo-icon"> <path d="M 14 1 L 26 21 L 23.3 21 L 14 5.5 L 4.7 21 L 2 21 Z" fill